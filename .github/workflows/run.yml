name: PJF run

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "New companies to look up on ATS boards this run"
        default: "40"

permissions:
  contents: write

concurrency:
  group: pjf
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run PJF
        env:
          PROBE: ${{ inputs.probe }}
        run: python pjf.py run --probe "$PROBE"

      - name: Commit state and page
        run: |
          git config user.name "pjf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state docs
          git diff --cached --quiet || git commit -m "run $(date -u +%F)"
          # If something was pushed while this run was working (code, or another run),
          # replay this run's commit on top; its results win over older ones.
          git pull --rebase -X theirs
          git push
